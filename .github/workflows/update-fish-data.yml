name: Update Fish Data

on:
  schedule:
    - cron: '0 0 * * SUN'  # Runs at 00:00 UTC every Sunday
  workflow_dispatch:        # Allows manual trigger
  
jobs:
  update-fish-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
        
    - name: Run update scripts
      run: |
        python generate_fish_json.py
        python generate_research_data.py
      
    - name: Check for changes
      id: check_changes
      run: |
        # porcelain also catches new, untracked files (the first run of a new data file)
        if [ -n "$(git status --porcelain AutoHook/Data/FishData)" ]; then echo "changes=true" >> $GITHUB_OUTPUT; fi
        
    - name: Commit and push if changed
      if: steps.check_changes.outputs.changes == 'true'
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        git add AutoHook/Data/FishData/fish_list.json AutoHook/Data/FishData/spot_pools.json AutoHook/Data/FishData/fish_tracker.json
        git commit -m "Update fish data [skip ci]"
        git push